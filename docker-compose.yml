x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: pms-backend:1.0.0
  environment:
    SERVER_PORT: 8080
    JAVA_OPTS: -Xmx512m -Xms256m
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: pms
    DB_USER: pms
    DB_PASSWORD: pms
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    GRAFANA_OTLP_URL: ${GRAFANA_OTLP_URL:-http://localhost:4318}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  expose:
    - "8080"
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped
  networks:
    - pms-network

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
    ports:
      - "5432:5432"
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pms-network

  backend:
    <<: *backend-common
    ports:
      - "8080:8080"

  # backend-2:
  #   <<: *backend-common

  # nginx:
  #   image: nginx:1.27-alpine
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     backend-2:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - pms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - pms-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - pms-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.5-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    networks:
      - pms-network
    restart: unless-stopped

volumes:
  pms-postgres-data:

networks:
  pms-network:
    driver: bridge
