x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: pms-backend:1.0.0
  environment:
    SERVER_PORT: 8080
    JAVA_OPTS: -Xmx512m -Xms256m
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped
  networks:
    - pms-network

services:
  backend:
    <<: *backend-common
    ports:
      - "8080:8080"

