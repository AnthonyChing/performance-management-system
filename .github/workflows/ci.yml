name: CI - Backend Quality and Security Checks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting (Spotless)
        run: mvn spotless:check

      - name: Check Code Quality (Checkstyle)
        run: mvn checkstyle:check

      - name: Find Bugs (SpotBugs)
        run: mvn spotbugs:check

      - name: Run Unit Tests
        run: mvn test

