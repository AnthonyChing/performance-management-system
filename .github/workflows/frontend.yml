name: Build and deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '!**.md'

jobs:
  pass_check:
    runs-on: ubuntu-latest
    steps:
      - name: Do nothing
        run: echo "Workflow passes without doing anything"

