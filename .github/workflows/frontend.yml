name: Frontend Pipeline
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pipeline.yml'
      - '!**.md'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pipeline.yml'
      - '!**.md'
  workflow_dispatch:
# Temporary workaround for Node.js 20 deprecation in GitHub hosted runners.
# Remove once FirebaseExtended/action-hosting-deploy@v0 supports Node.js 22.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json
        
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript type check
        run: npm run lint
      - name: Run unit tests
        run: npm run test
      # E2E tests are disabled until frontend pages are fully implemented
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps
      # - name: Run Playwright tests
      #   run: npm run test:e2e
      # - name: Upload Playwright report
      #   uses: actions/upload-artifact@v7
      #   if: always()
      #   with:
      #     name: playwright-report
      #     path: frontend/playwright-report/
      #     retention-days: 14
  frontend-build-and-deploy:
    needs: frontend-test
    # Run on: manual dispatch, tag push, or push to main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json
        
      - name: Install dependencies
        run: npm install
      - name: Set API URL for Staging (Main Branch)
        if: github.ref == 'refs/heads/main'
        run: echo "VITE_API_ORIGIN=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV
      - name: Set API URL for Production (Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VITE_API_ORIGIN=${{ vars.PROD_API_URL }}" >> $GITHUB_ENV
      - name: Set Google Client ID
        run: echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
      - name: Build frontend
        run: npm run build
        
      # Deploy to staging/preview channel if from `main` branch
      - name: Deploy to Firebase Preview Channel (Staging)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAGE_ETCHING_496105_K7 }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: staging
          entryPoint: ./frontend
      # Deploy to production channel if from a `v*` tag
      - name: Deploy to Firebase Production Channel
        if: startsWith(github.ref, 'refs/tags/v')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAGE_ETCHING_496105_K7 }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
          entryPoint: ./frontend