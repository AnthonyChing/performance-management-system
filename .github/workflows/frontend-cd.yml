name: Frontend CD (Firebase)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
      - '!**.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json
        
      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        
      # Deploy to staging/preview channel if from `main` branch
      - name: Deploy to Firebase Preview Channel (Staging)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAGE_ETCHING_496105_K7 }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: staging
          entryPoint: ./frontend

      # Deploy to production channel if from a `v*` tag
      - name: Deploy to Firebase Production Channel
        if: startsWith(github.ref, 'refs/tags/v')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAGE_ETCHING_496105_K7 }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
          entryPoint: ./frontend
