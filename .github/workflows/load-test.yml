name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test to run'
        required: true
        type: choice
        options:
          - load-test.js
          - spike-test.js
          - stress-test.js
        default: 'load-test.js'
      target_env:
        description: 'Target Environment URL'
        required: true
        default: 'https://backend-staging-1078971769535.asia-east1.run.app'

jobs:
  k6-load-test:
    name: Run k6 Load Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 test
        run: k6 run ${{ github.event.inputs.test_type }}
        env:
          BASE_URL: ${{ github.event.inputs.target_env }}
          TZ: Asia/Taipei
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-report
          path: summary.html
