name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '!**.md'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json
        
      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      # E2E tests are disabled until frontend pages are fully implemented
