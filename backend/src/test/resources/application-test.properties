# =====================================================================
# Test Profile Configuration
# Datasource is automatically overridden by Testcontainers
# @ServiceConnection in TestcontainersConfig handles the connection URL
# =====================================================================

# JPA - use create-drop so each test run starts clean
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Actuator noise in test logs
logging.level.org.springframework.boot.actuate=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
