# =====================================================================
# Test Profile Configuration
# Datasource is automatically overridden by Testcontainers
# @ServiceConnection in TestcontainersConfig handles the connection URL
# =====================================================================

# JPA - schema is owned by Flyway; Hibernate must only validate.
# 'create-drop' would conflict with Flyway by replacing the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway runs the same migrations used in production so tests catch SQL errors early.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/test-seed
spring.flyway.clean-disabled=false

# Disable Actuator noise in test logs
logging.level.org.springframework.boot.actuate=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.flywaydb=INFO

# JWT — fixed test secret (32+ ASCII chars = 256-bit key)
pms.jwt.secret=test-secret-key-for-integration-tests-only-do-not-use-in-prod
pms.jwt.expiration-ms=3600000

# Google OAuth2 — not called during tests
pms.google.client-id=test-google-client-id
